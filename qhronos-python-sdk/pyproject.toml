[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qhronos"
version = "0.1.0"
description = "Official Python SDK for Qhronos - Event Scheduling and Workflow Orchestration Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Qhronos Team", email = "team@qhronos.io" }
]
keywords = [
    "qhronos",
    "scheduler",
    "workflow",
    "events",
    "cron",
    "jobs",
    "webhooks",
    "orchestration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/feedloop/qhronos-monorepo"
Repository = "https://github.com/feedloop/qhronos-monorepo.git"
Documentation = "https://github.com/feedloop/qhronos-monorepo#readme"
Issues = "https://github.com/feedloop/qhronos-monorepo/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qhronos"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

